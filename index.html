<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three.js AR Camera</title>
<style>
  body { margin: 0; overflow: hidden; }
  canvas { position: fixed; top: 0; left: 0; }

  #captureBtn {
    position: fixed;
    bottom: 20px;
    right: 20px;
    background: #ff4081;
    color: white;
    border: none;
    padding: 14px 20px;
    border-radius: 50px;
    font-size: 18px;
    font-weight: bold;
    z-index: 10;
  }

  /* 追加：リセットボタン */
  #resetBtn {
    position: fixed;
    bottom: 20px;
    left: 20px;
    background: #4caf50;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    z-index: 10;
  }

  /* 追加：位置固定ボタン */
  #lockBtn {
    position: fixed;
    bottom: 80px;
    left: 20px;
    background: #2196f3;
    color: white;
    border: none;
    padding: 12px 18px;
    border-radius: 10px;
    font-size: 16px;
    font-weight: bold;
    z-index: 10;
  }
</style>
</head>
<body>

<button id="captureBtn">📸 撮影</button>
<button id="resetBtn">🔄 リセット</button>
<button id="lockBtn">📌 位置固定</button>

<script type="module">
alert("module start");

import * as THREE from "./three/three.module.js";
import { GLTFLoader } from "./three/GLTFLoader.js";

let scene, camera, renderer;
let video, videoTexture;
let model;

// 初期状態保存用
let initialState = {
  position: { x: 0, y: 0, z: 0 },
  rotation: { x: 0, y: 0, z: 0 },
  scale: { x: 1, y: 1, z: 1 }
};

// 位置固定フラグ
let isLocked = false;

async function initCamera() {
  video = document.createElement("video");
  video.setAttribute("autoplay", "");
  video.setAttribute("playsinline", "");

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ video: true });
    video.srcObject = stream;

    return new Promise(resolve => {
      video.onloadedmetadata = () => resolve();
    });

  } catch (err) {
    alert("カメラエラー: " + err.name + " / " + err.message);
  }
}

async function init() {
  alert("init start");

  await initCamera();

  scene = new THREE.Scene();

  // ライト追加（カラー表示のため）
  const ambient = new THREE.AmbientLight(0xffffff, 1.2);
  scene.add(ambient);

  const directional = new THREE.DirectionalLight(0xffffff, 1.0);
  directional.position.set(1, 1, 1);
  scene.add(directional);

  videoTexture = new THREE.VideoTexture(video);
  scene.background = videoTexture;

  camera = new THREE.PerspectiveCamera(
    70,
    window.innerWidth / window.innerHeight,
    0.1,
    100
  );
  camera.position.set(0, 0, 2);

  renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  document.body.appendChild(renderer.domElement);

  const loader = new GLTFLoader();
  loader.load(
    "AR_prd.glb",
    (gltf) => {
      model = gltf.scene;
      model.scale.set(1, 1, 1);
      scene.add(model);

      // 初期状態を記録
      initialState.position = { x: model.position.x, y: model.position.y, z: model.position.z };
      initialState.rotation = { x: model.rotation.x, y: model.rotation.y, z: model.rotation.z };
      initialState.scale = { x: model.scale.x, y: model.scale.y, z: model.scale.z };
    },
    undefined,
    (error) => {
      alert("GLB読み込みエラー: " + error.message);
    }
  );

  animate();
}

function animate() {
  requestAnimationFrame(animate);
  renderer.render(scene, camera);
}

document.getElementById("captureBtn").addEventListener("click", () => {
  const dataURL = renderer.domElement.toDataURL("image/png");
  const link = document.createElement("a");
  link.href = dataURL;
  link.download = "ar_photo.png";
  link.click();
});

// -----------------------------
// リセットボタン
// -----------------------------
document.getElementById("resetBtn").addEventListener("click", () => {
  if (!model) return;

  model.position.set(
    initialState.position.x,
    initialState.position.y,
    initialState.position.z
  );

  model.rotation.set(
    initialState.rotation.x,
    initialState.rotation.y,
    initialState.rotation.z
  );

  model.scale.set(
    initialState.scale.x,
    initialState.scale.y,
    initialState.scale.z
  );
});

// -----------------------------
// 位置固定ボタン（トグル）
// -----------------------------
document.getElementById("lockBtn").addEventListener("click", () => {
  isLocked = !isLocked;

  document.getElementById("lockBtn").textContent =
    isLocked ? "🔓 位置解除" : "📌 位置固定";
});

// -----------------------------
// タッチ操作（回転・移動・拡大）
// -----------------------------
let previousTouch = null;
let previousDistance = null;

function getDistance(t1, t2) {
  const dx = t1.clientX - t2.clientX;
  const dy = t1.clientY - t2.clientY;
  return Math.sqrt(dx * dx + dy * dy);
}

window.addEventListener("touchstart", (e) => {
  if (!model) return;

  if (e.touches.length === 1) {
    previousTouch = e.touches[0];
  } else if (e.touches.length === 2) {
    previousDistance = getDistance(e.touches[0], e.touches[1]);
  }
});

window.addEventListener("touchmove", (e) => {
  if (!model) return;

  if (e.touches.length === 1) {
    const touch = e.touches[0];
    const dx = touch.clientX - previousTouch.clientX;
    const dy = touch.clientY - previousTouch.clientY;

    const screenHeight = window.innerHeight;

    if (touch.clientY < screenHeight * 0.5) {
      // 回転
      model.rotation.y += dx * 0.01;
      model.rotation.x += dy * 0.01;
    } else {
      // 移動（位置固定中は無効）
      if (!isLocked) {
        model.position.x += dx * 0.005;
        model.position.y -= dy * 0.005;
      }
    }

    previousTouch = touch;
  }

  if (e.touches.length === 2) {
    const newDistance = getDistance(e.touches[0], e.touches[1]);
    const scaleChange = (newDistance - previousDistance) * 0.005;

    model.scale.x += scaleChange;
    model.scale.y += scaleChange;
    model.scale.z += scaleChange;

    previousDistance = newDistance;
  }
});

window.addEventListener("touchend", () => {
  previousTouch = null;
  previousDistance = null;
});

init();
</script>

</body>
</html>

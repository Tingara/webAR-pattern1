<!DOCTYPE html>
<html>
<body>
<h1>Camera Test</h1>
<video id="v" autoplay playsinline style="width:100vw;"></video>

<script>
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => {
    document.getElementById("v").srcObject = stream;
  })
  .catch(err => {
    alert("Error: " + err.name + " / " + err.message);
  });
</script>

</body>
</html>
